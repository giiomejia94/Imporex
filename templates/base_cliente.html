<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Imporex{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block estilos %}{% endblock %}
</head>
<body>

<header class="header">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}">
    <input class="search" type="text" placeholder="Buscar por código o nombre de producto y pedido">
    <div class="user-badge">
        <div class="dropdown">
            <div class="user-badge-inner">
                <img id="headerFotoUsuario"
                    src="{% if session.get('foto_perfil') %}/{{ session['foto_perfil'] }}{% else %}{{ url_for('static', filename='img/avatar_default.png') }}{% endif %}"
                    alt="foto"
                    class="header-avatar"
                    onerror="this.src='/static/img/avatar_default.png'">
                <span>Hola, {{ session.get('nombre', session.get('username', '')) }}</span>
                <button class="dropbtn">▼</button>
            </div>
            <div class="dropdown-content">
                <a href="#" id="btnAbrirPerfil">Perfil</a>
                <a href="{{ url_for('logout') }}" class="logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="menu-lateral">
            <nav>
                <ul>
                    <li><a href="{{ url_for('inicio') }}" {% if request.endpoint == 'inicio' %}class="active"{% endif %}> Inicio</a></li>
                    <li><a href="{{ url_for('pedidos_cliente') }}" {% if request.endpoint == 'pedidos_cliente' %}class="active"{% endif %}> Pedidos</a></li>
                    <li><a href="{{ url_for('productos_cliente') }}" {% if request.endpoint == 'productos_cliente' %}class="active"{% endif %}> Productos</a></li>
                    <li><a href="{{ url_for('pedidos_progra_cliente') }}" {% if request.endpoint == 'pedidos_progra_cliente' %}class="active"{% endif %}> Ped. Programados</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <main>
        <!-- CARRUSEL — visible en todos los módulos cliente -->
        <div class="carousel-container" style="
            margin-left: var(--sidebar-w);
            width: calc(100% - var(--sidebar-w));
            padding: 106px 24px 0 100px;
            box-sizing: border-box;
            top: 76px;
        ">
            <div class="carousel">
                <div class="slide active">
                    <img src="{{ url_for('static', filename='img/pan-yellow.jpg') }}" alt="Pan amarillo" class="imgCarrusel">
                </div>
                <div class="slide">
                    <img src="{{ url_for('static', filename='img/pony malta.jpg') }}" alt="Pony Malta" class="imgCarrusel">
                </div>
                <div class="slide">
                    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Producto 3" class="imgCarrusel">
                </div>
            </div>
            <button class="btnCarrusel prev">❮</button>
            <button class="btnCarrusel next">❯</button>
            <div class="indicadores">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        {% block contenido %}{% endblock %}

    </main>
</div>

<!-- Modal Perfil Cliente — sin campo Rol -->
<div id="modalPerfil" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="position:relative;">
        <button type="button" id="btnCerrarModalPerfil"
                style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#64748B;">✕</button>
        <h3>Mi Perfil</h3>

        <div class="perfil-avatar-wrap">
            <img id="perfilFotoImg"
                src="{% if session.get('foto_perfil') %}/{{ session['foto_perfil'] }}{% else %}{{ url_for('static', filename='img/avatar_default.png') }}{% endif %}"
                alt="Foto de perfil"
                class="perfil-avatar-img"
                onerror="this.src='/static/img/avatar_default.png'">
            <label for="perfilFotoInput" class="btn-cambiar-foto">📷 Cambiar foto</label>
            <input type="file" id="perfilFotoInput" name="foto" accept="image/png,image/jpeg,image/gif" hidden>
        </div>

        <form id="formPerfil">
            <label>Usuario</label>
            <input type="text" id="perfilUsername" value="{{ session.get('username', '') }}" disabled>

            <label>Nombre</label>
            <input type="text" id="perfilNombre" name="nombre" value="{{ session.get('nombre', '') }}" disabled required>

            <label>Correo</label>
            <input type="email" id="perfilCorreo" name="correo" value="{{ session.get('correo', '') }}" disabled required>

            <label>Nueva contraseña <span class="campo-opcional">(dejar en blanco para no cambiar)</span></label>
            <input type="password" id="perfilPassword" name="password" placeholder="••••••••" disabled>

            <!-- SIN campo Rol — solo admin puede cambiarlo -->

            <div class="modal-acciones">
                <button type="button" id="btnHabilitarEdicionPerfil" class="btn-primary">✏️ Editar</button>
                <button type="submit" id="btnGuardarPerfil" class="btn-primary" style="display:none">💾 Guardar</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<script src="{{ url_for('static', filename='js/perfil.js') }}"></script>
<script src="{{ url_for('static', filename='js/carrusel.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
